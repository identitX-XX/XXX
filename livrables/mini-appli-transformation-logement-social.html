<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1b2a41">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan 6 leviers">
<meta name="author" content="Marina Bignon">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2316233b'/%3E%3Cpath d='M32 16v14M14 46V30h36v16M32 30v16' stroke='%23faf8f4' stroke-width='3' fill='none'/%3E%3Ccircle cx='32' cy='14' r='5' fill='%23faf8f4'/%3E%3Ccircle cx='14' cy='48' r='5' fill='%23faf8f4'/%3E%3Ccircle cx='32' cy='48' r='5' fill='%23faf8f4'/%3E%3Ccircle cx='50' cy='48' r='5' fill='%23faf8f4'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2316233b'/%3E%3Cpath d='M32 16v14M14 46V30h36v16M32 30v16' stroke='%23faf8f4' stroke-width='3' fill='none'/%3E%3Ccircle cx='32' cy='14' r='5' fill='%23faf8f4'/%3E%3Ccircle cx='14' cy='48' r='5' fill='%23faf8f4'/%3E%3Ccircle cx='32' cy='48' r='5' fill='%23faf8f4'/%3E%3Ccircle cx='50' cy='48' r='5' fill='%23faf8f4'/%3E%3C/svg%3E">
<title>Plan de transformation — Mini appli</title>
<style>
  /* Mise en page : appli mobile, une colonne ; aplats institutionnels, aucun dégradé */
  :root {
    color-scheme: light;
    --nuit: #1b2a41; --bleu: #355c86; --canard: #1f6b68;
    --fond: #ffffff; --surface: #f1f3f5; --surface-2: #e4e8ec; --bord: #d3d9df;
    --texte: #1d232b; --discret: #56606b; --hors-app: #dfe3e7;
    --police: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --haut: calc(56px + env(safe-area-inset-top));
    --bas: calc(64px + env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--hors-app); color: var(--texte); font-family: var(--police); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  :focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; }
  h1, h2, h3 { font-weight: 700; color: var(--nuit); margin: 0; line-height: 1.25; text-wrap: balance; }
  p { margin: 0 0 .7em; }
  ul, ol { margin: 0; padding: 0; list-style: none; }

  .app { position: relative; max-width: 480px; height: 100%; margin: 0 auto; background: var(--fond); overflow: hidden; }

  /* Barre du haut */
  .topbar { position: absolute; top: 0; left: 0; right: 0; height: var(--haut); padding: env(safe-area-inset-top) 14px 0 6px; background: var(--nuit); color: #fff; display: flex; align-items: center; gap: 8px; z-index: 10; }
  .topbar .titre { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .topbar .retour { display: none; align-items: center; gap: 2px; height: 40px; padding: 0 8px; color: #fff; font-size: 15px; }
  .topbar.avec-retour .retour { display: inline-flex; }
  .topbar:not(.avec-retour) .titre { padding-left: 10px; }
  .topbar .prog { font-size: 12px; font-weight: 600; background: var(--canard); color: #fff; padding: 3px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Écrans */
  .ecran { position: absolute; top: var(--haut); bottom: var(--bas); left: 0; right: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 20px 16px 28px; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
  .ecran.actif { opacity: 1; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { .ecran { transition: none; } }

  .surtitre { font-size: 13px; font-weight: 700; color: var(--canard); margin-bottom: 6px; }
  .ecran h1 { font-size: 24px; margin-bottom: 8px; }
  .chapo { color: var(--discret); font-size: 15px; }

  /* Arbre */
  .racine { background: var(--nuit); color: #fff; padding: 14px 16px; margin-top: 16px; font-size: 16px; font-weight: 600; line-height: 1.4; }
  .racine span { display: block; font-size: 12.5px; font-weight: 700; color: #c9d3de; margin-bottom: 2px; }
  .tronc { width: 2px; height: 14px; background: var(--bord); margin-left: 21px; }
  .branches { margin-left: 21px; border-left: 2px solid var(--bord); padding-left: 12px; display: grid; gap: 8px; padding-bottom: 2px; }
  .branche { position: relative; display: grid; grid-template-columns: 34px 1fr 16px; gap: 12px; align-items: center; width: 100%; padding: 12px; background: var(--surface); }
  .branche::before { content: ""; position: absolute; left: -14px; top: 50%; width: 12px; height: 2px; background: var(--bord); }
  .branche .n { width: 34px; height: 34px; display: grid; place-items: center; background: var(--bleu); color: #fff; font-weight: 700; font-size: 16px; }
  .branche:nth-child(even) .n { background: var(--canard); }
  .branche .t { font-weight: 700; color: var(--nuit); font-size: 15px; line-height: 1.3; display: block; }
  .branche .p { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 12px; color: var(--discret); font-variant-numeric: tabular-nums; }
  .jauge { flex: 1; max-width: 130px; height: 6px; background: var(--surface-2); position: relative; }
  .jauge i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--canard); transition: width .3s; }
  .fleche { color: var(--discret); }
  .branche:active { background: var(--surface-2); }

  .synthese { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 22px; }
  .synthese div { background: var(--surface); padding: 12px 10px; }
  .synthese strong { display: block; font-size: 22px; font-weight: 700; color: var(--nuit); line-height: 1.1; }
  .synthese span { font-size: 12px; color: var(--discret); line-height: 1.3; display: block; margin-top: 2px; }

  .publics { margin-top: 22px; display: grid; gap: 8px; }
  .publics details { border: 1px solid var(--bord); }
  .publics summary { list-style: none; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
  .publics summary::-webkit-details-marker { display: none; }
  .publics summary b { font-weight: 700; color: var(--nuit); font-size: 15px; display: block; }
  .publics summary em { font-style: normal; font-size: 12.5px; color: var(--canard); font-weight: 700; display: block; }
  .publics summary::after { content: "+"; font-size: 22px; line-height: 1; color: var(--bleu); font-weight: 400; }
  .publics details[open] summary::after { content: "−"; }
  .publics p { font-size: 14px; padding: 0 14px 12px; margin: 0; }

  /* Levier */
  .lev-tete { display: flex; gap: 14px; align-items: center; }
  .lev-tete .gn { flex: none; width: 52px; height: 52px; display: grid; place-items: center; background: var(--bleu); color: #fff; font-size: 26px; font-weight: 700; }
  .lev-tete.pair .gn { background: var(--canard); }
  .lev-tete .surtitre { margin-bottom: 2px; }
  .lev-tete h1 { font-size: 21px; margin: 0; }
  .lev-resume { color: var(--texte); font-size: 15px; margin: 14px 0 0; }
  .lev-meta { display: grid; grid-template-columns: auto 1fr; gap: 1px; margin-top: 12px; font-size: 13.5px; background: var(--bord); border: 1px solid var(--bord); }
  .lev-meta span { display: contents; }
  .lev-meta span::before { content: attr(data-l); background: var(--surface); padding: 7px 10px; color: var(--discret); }
  .lev-meta b { background: var(--fond); padding: 7px 10px; color: var(--nuit); font-weight: 600; }

  .onglets { position: sticky; top: -20px; z-index: 2; background: var(--fond); margin: 16px -16px 0; padding: 8px 16px 0; display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; border-bottom: 2px solid var(--surface-2); }
  .onglets::-webkit-scrollbar { display: none; }
  .onglet { flex: 1 0 auto; padding: 8px 6px 9px; font-size: 13.5px; text-align: center; font-weight: 600; color: var(--discret); border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .onglet[aria-selected="true"] { color: var(--nuit); border-bottom-color: var(--bleu); }
  .panneau { padding-top: 14px; min-height: 240px; }
  .panneau[hidden] { display: none; }

  .diag { display: grid; gap: 8px; }
  .diag li { position: relative; padding: 10px 12px 10px 26px; font-size: 15px; background: var(--surface); }
  .diag li::before { content: ""; position: absolute; left: 12px; top: 19px; width: 6px; height: 6px; background: var(--bleu); }

  .act { display: grid; gap: 8px; }
  .case { display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding: 12px; width: 100%; align-items: start; background: var(--surface); }
  .case .box { width: 22px; height: 22px; border: 2px solid var(--bleu); display: grid; place-items: center; margin-top: 1px; background: var(--fond); }
  .case .box svg { opacity: 0; }
  .case[aria-checked="true"] { background: #e3efee; }
  .case[aria-checked="true"] .box { background: var(--canard); border-color: var(--canard); }
  .case[aria-checked="true"] .box svg { opacity: 1; }
  .case strong { display: block; color: var(--nuit); font-size: 15px; line-height: 1.35; }
  .case span.d { display: block; color: var(--discret); font-size: 13.5px; margin-top: 3px; line-height: 1.4; }
  .astuce { font-size: 13px; color: var(--discret); margin-top: 12px; }

  .pil { display: grid; gap: 8px; }
  .pil li { background: var(--surface); padding: 10px 12px; }
  .pil em { display: block; font-style: normal; font-size: 12.5px; color: var(--canard); font-weight: 700; }
  .pil b { display: block; color: var(--nuit); font-weight: 700; font-size: 15px; }
  .pil span { font-size: 13.5px; color: var(--discret); }

  .jal { display: grid; gap: 8px; }
  .jal li { display: grid; grid-template-columns: 56px 1fr; align-items: stretch; background: var(--surface); }
  .jal b { display: grid; place-items: center; background: var(--canard); color: #fff; font-weight: 700; font-size: 15px; }
  .jal span { padding: 10px 12px; font-size: 15px; }

  .eff { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .eff li { background: var(--surface); padding: 10px 12px; font-size: 14px; line-height: 1.4; }
  .eff em { display: block; font-style: normal; font-size: 12.5px; color: var(--canard); font-weight: 700; margin-bottom: 2px; }
  @media (max-width: 360px) { .eff { grid-template-columns: 1fr; } }

  .lev-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 10px 12px; border: 2px solid var(--nuit); background: var(--fond); color: var(--nuit); font-size: 14.5px; font-weight: 700; text-align: center; }
  .btn.plein { background: var(--nuit); color: #fff; grid-column: 1 / -1; }
  .btn:disabled { opacity: .3; cursor: default; }

  /* 90 jours */
  .segments { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); padding: 4px; margin: 14px 0 4px; }
  .segment { padding: 9px 4px; font-size: 14px; font-weight: 700; text-align: center; color: var(--discret); }
  .segment[aria-selected="true"] { background: var(--nuit); color: #fff; }
  .phase-t { margin-top: 16px; }
  .phase-t h2 { font-size: 20px; }
  .phase-t p { color: var(--discret); font-size: 14.5px; margin-top: 4px; }
  .etapes { margin-top: 10px; display: grid; gap: 6px; }
  .etape { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 10px 12px; background: var(--surface); font-size: 14.5px; }
  .etape b { color: var(--nuit); font-variant-numeric: tabular-nums; font-size: 13.5px; }
  .etape i { font-style: normal; font-size: 12px; font-weight: 700; color: #fff; background: var(--bleu); padding: 1px 6px; }
  .rdv { margin-top: 12px; font-size: 14px; background: #e3efee; padding: 12px; }
  .rdv b { color: var(--canard); }
  .instances { margin-top: 22px; display: grid; gap: 6px; }
  .instances li { border: 1px solid var(--bord); padding: 10px 12px; font-size: 13.5px; color: var(--discret); }
  .instances b { display: block; color: var(--nuit); font-size: 14.5px; }

  /* Indicateurs */
  .kpi { background: var(--surface); margin-top: 8px; }
  .kpi-tete { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 12px; }
  .kpi-tete .n { width: 30px; height: 30px; display: grid; place-items: center; background: var(--nuit); color: #fff; font-weight: 700; font-size: 14px; }
  .kpi-tete .t { font-weight: 700; color: var(--nuit); font-size: 14.5px; line-height: 1.3; }
  .kpi-tete .c { font-weight: 700; color: var(--canard); font-size: 15px; white-space: nowrap; text-align: right; }
  .kpi-corps { padding: 0 12px 14px 52px; font-size: 14px; }
  .kpi-corps[hidden] { display: none; }
  .kpi-corps .def { color: var(--discret); }
  .kpi-corps dl { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; margin: 8px 0; }
  .kpi-corps dt { color: var(--discret); }
  .kpi-corps dd { margin: 0; }
  .kpi-corps .alerte { background: var(--fond); border-left: 4px solid var(--bleu); padding: 8px 10px; margin: 10px 0; }
  .liens { display: flex; flex-wrap: wrap; gap: 6px; }
  .liens button { border: 2px solid var(--bleu); padding: 3px 8px; font-size: 13px; font-weight: 700; color: var(--bleu); background: var(--fond); }
  .note { font-size: 13px; color: var(--discret); margin-top: 14px; }

  .signature { margin-top: 30px; padding-top: 12px; border-top: 2px solid var(--surface-2); font-size: 13px; color: var(--discret); }
  .signature span { display: inline; }
  .signature span::after { content: " "; }
  .signature b { color: var(--nuit); font-weight: 700; }

  /* Barre d'onglets */
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--bas); padding-bottom: env(safe-area-inset-bottom); background: var(--fond); border-top: 1px solid var(--bord); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 10; }
  .tab { text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--discret); text-align: center; }
  .tab svg { width: 22px; height: 22px; }
  .tab[aria-current="page"] { color: var(--nuit); box-shadow: inset 0 3px 0 var(--bleu); }

  .toast { position: absolute; left: 50%; bottom: calc(var(--bas) + 14px); transform: translate(-50%, 8px); background: var(--nuit); color: #fff; font-size: 13px; padding: 8px 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; white-space: nowrap; }
  .toast.vu { opacity: 1; transform: translate(-50%, 0); }

  @media (min-width: 520px) {
    body { padding: 24px 0; }
    .app { height: calc(100% - 48px); max-height: 900px; box-shadow: 0 0 0 1px var(--bord); }
  }

  /* Accès rapides */
  .outils { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 22px; }
  .outil { display: block; background: var(--nuit); color: #fff; padding: 12px; min-height: 84px; }
  .outil:nth-child(2) { background: var(--canard); }
  .outil b { display: block; font-size: 15px; line-height: 1.3; }
  .outil span { display: block; font-size: 12.5px; color: #d6dee6; margin-top: 4px; }
  .h2 { font-size: 18px; margin: 26px 0 10px; }

  /* Fiches réflexes */
  .fiches { display: grid; gap: 8px; margin-top: 16px; }
  .fiche { background: var(--surface); }
  .fiche-tete { display: grid; grid-template-columns: 30px 1fr 18px; gap: 10px; align-items: center; width: 100%; padding: 12px; }
  .fn { width: 30px; height: 30px; display: grid; place-items: center; background: var(--nuit); color: #fff; font-weight: 700; font-size: 14px; }
  .ft { font-weight: 700; color: var(--nuit); font-size: 15px; line-height: 1.3; }
  .ft small { display: block; font-weight: 600; font-size: 12px; color: var(--canard); margin-top: 2px; }
  .fs { font-size: 22px; line-height: 1; color: var(--bleu); text-align: center; }
  .fiche-corps { padding: 0 12px 14px; display: grid; gap: 10px; }
  .fiche-corps[hidden] { display: none; }
  .fex { margin: 0; font-size: 14px; color: var(--discret); }
  .fdelai, .feviter { font-size: 14px; padding: 9px 12px; background: var(--fond); border-left: 4px solid var(--canard); }
  .feviter { border-left-color: #9a3b2e; }
  .fdelai b, .feviter b { display: block; font-size: 12.5px; color: var(--nuit); }
  .fetapes { counter-reset: e; display: grid; gap: 6px; }
  .fetapes li { counter-increment: e; position: relative; padding: 9px 12px 9px 40px; background: var(--fond); font-size: 14px; }
  .fetapes li::before { content: counter(e); position: absolute; left: 10px; top: 9px; width: 20px; height: 20px; display: grid; place-items: center; background: var(--bleu); color: #fff; font-size: 12px; font-weight: 700; }
  .fetapes b { display: block; color: var(--nuit); font-size: 13.5px; }

  /* IKOS */
  .niv { flex: none; width: 30px; height: 30px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; }
  .niv-1 { background: #8a94a0; } .niv-2 { background: #5d7896; } .niv-3 { background: var(--bleu); } .niv-4 { background: var(--canard); }
  .echelle { display: grid; gap: 6px; }
  .echelle li { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); padding: 10px 12px; }
  .echelle b { display: block; color: var(--nuit); font-size: 15px; }
  .echelle span { display: block; font-size: 13.5px; color: var(--discret); line-height: 1.4; }
  .lbl { display: block; font-size: 13.5px; font-weight: 700; color: var(--nuit); margin-bottom: 6px; }
  .select { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border: 2px solid var(--bord); background: var(--fond); color: var(--texte); border-radius: 0; }
  .questions { display: grid; gap: 8px; margin-top: 14px; counter-reset: q; }
  .questions li { background: var(--surface); padding: 10px 12px 12px; counter-increment: q; }
  .questions p { margin: 0 0 8px; font-size: 14.5px; color: var(--nuit); font-weight: 600; }
  .questions p::before { content: counter(q) ". "; color: var(--bleu); }
  .choix { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .choix button, .m-choix button { padding: 8px 2px; font-size: 12.5px; font-weight: 600; text-align: center; background: var(--fond); border: 1px solid var(--bord); color: var(--discret); }
  .choix button[aria-checked="true"] { background: var(--bleu); border-color: var(--bleu); color: #fff; }
  .resultat { margin-top: 12px; padding: 14px; background: var(--surface); border-left: 5px solid var(--bleu); font-size: 14.5px; }
  .resultat.vide { border-left-color: var(--bord); color: var(--discret); }
  .niv-fond-1 { border-left-color: #8a94a0; } .niv-fond-2 { border-left-color: #5d7896; } .niv-fond-4 { border-left-color: var(--canard); }
  .r-tete { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .r-tete .niv { width: 44px; height: 44px; font-size: 22px; }
  .r-tete > div > span { display: block; font-size: 12.5px; color: var(--discret); }
  .r-tete b { font-size: 20px; color: var(--nuit); }
  .r-ecart { font-weight: 600; color: var(--nuit); }
  .r-conseil b { color: var(--canard); }
  .matrice { display: grid; gap: 6px; margin-top: 4px; }
  .m-ligne { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--surface); padding: 10px 12px; }
  .m-role b { display: block; font-size: 14px; color: var(--nuit); line-height: 1.3; }
  .m-role span { font-size: 12px; color: var(--discret); margin-right: 6px; }
  .m-role .ok, .m-role .ko { display: inline-block; font-size: 11.5px; font-weight: 700; color: #fff; padding: 0 6px; }
  .m-role .ok { background: var(--canard); } .m-role .ko { background: #9a3b2e; }
  .m-choix { display: grid; grid-template-columns: repeat(4, 32px); gap: 3px; }
  .m-choix button { padding: 6px 0; font-size: 14px; }
  .m-choix .mv-1[aria-checked="true"] { background: #8a94a0; border-color: #8a94a0; color: #fff; }
  .m-choix .mv-2[aria-checked="true"] { background: #5d7896; border-color: #5d7896; color: #fff; }
  .m-choix .mv-3[aria-checked="true"] { background: var(--bleu); border-color: var(--bleu); color: #fff; }
  .m-choix .mv-4[aria-checked="true"] { background: var(--canard); border-color: var(--canard); color: #fff; }
  .m-synthese { font-size: 13.5px; font-weight: 600; color: var(--nuit); margin-top: 10px; }

      resultat = '<div class="resultat niv-fond-' + niv + '"><div class="r-tete">' + badgeNiv(niv) + '<div><span>Votre niveau</span><b>' + NIVEAUX[niv - 1][0] + '</b></div></div>' +
        '<p>' + esc(NIVEAUX[niv - 1][1]) + '</p><p class="r-ecart">' + esc(msg) + '</p>' +
        '<p class="r-conseil"><b>Prochaine étape :</b> ' + esc(CONSEILS[niv - 1]) + '</p>' +
        '<button class="btn" data-ikos-reset="1">Refaire l’autodiagnostic</button></div>';
    } else {
      var nb = 0; for (var q = 0; q < QUESTIONS.length; q++) if (ikos.rep[q]) nb++;
      resultat = '<div class="resultat vide">Répondez aux ' + QUESTIONS.length + ' affirmations pour obtenir votre niveau (' + nb + ' / ' + QUESTIONS.length + ').</div>';
    }
    var nbMat = 0, sousCible = 0;
    ROLES.forEach(function (r, i) { if (ikos.mat[i]) { nbMat++; if (ikos.mat[i] < r[1]) sousCible++; } });

    $("e-ikos").innerHTML =
      '<div class="surtitre">Outil métier · Levier 4</div><h1>Prise en main d’IKOS</h1>' +
      '<p class="chapo">Une échelle commune en quatre niveaux pour situer chaque collaborateur et chaque fonction, puis cibler l’accompagnement.</p>' +

      '<h2 class="h2">L’échelle</h2><ol class="echelle">' + NIVEAUX.map(function (n, i) {
        return '<li>' + badgeNiv(i + 1) + '<div><b>' + n[0] + '</b><span>' + esc(n[1]) + '</span></div></li>';
      }).join("") + '</ol>' +

      '<h2 class="h2">Mon autodiagnostic</h2>' +
      '<label class="lbl" for="ikosRole">Ma fonction</label>' +
      '<select id="ikosRole" class="select"><option value="">Choisir…</option>' + ROLES.map(function (r, i) {
        return '<option value="' + i + '"' + (String(i) === String(ikos.role) ? " selected" : "") + '>' + esc(r[0]) + '</option>';
      }).join("") + '</select>' +
      '<ol class="questions">' + QUESTIONS.map(function (q, i) {
        return '<li><p>' + esc(q) + '</p><div class="choix" role="radiogroup" aria-label="' + esc(q) + '">' + REPONSES.map(function (r, v) {
          return '<button role="radio" aria-checked="' + (ikos.rep[i] === v + 1) + '" data-q="' + i + '" data-v="' + (v + 1) + '">' + esc(r) + '</button>';
        }).join("") + '</div></li>';
      }).join("") + '</ol>' + resultat +

      '<h2 class="h2">Matrice de l’agence</h2>' +
      '<p class="chapo">Pour le directeur d’agence ou son adjoint : indiquez le niveau observé pour chaque fonction. Le niveau cible est une proposition à valider.</p>' +
      '<div class="matrice">' + ROLES.map(function (r, i) {
        var n = ikos.mat[i] || 0, etat = !n ? "" : n >= r[1] ? '<span class="ok">Atteint</span>' : '<span class="ko">Écart ' + (r[1] - n) + '</span>';
        return '<div class="m-ligne"><div class="m-role"><b>' + esc(r[0]) + '</b><span>Cible ' + r[1] + ' · ' + NIVEAUX[r[1] - 1][0] + '</span>' + etat + '</div>' +
          '<div class="m-choix" role="radiogroup" aria-label="Niveau observé : ' + esc(r[0]) + '">' + [1, 2, 3, 4].map(function (v) {
            return '<button role="radio" class="mv-' + v + '" aria-checked="' + (n === v) + '" data-mat="' + i + '" data-v="' + v + '">' + v + '</button>';
          }).join("") + '</div></div>';
      }).join("") + '</div>' +
      '<p class="m-synthese">' + (nbMat ? nbMat + ' fonction' + (nbMat > 1 ? 's' : '') + ' renseignée' + (nbMat > 1 ? 's' : '') + ' sur ' + ROLES.length + ' · ' + sousCible + ' sous le niveau cible' : 'Aucune fonction renseignée pour l’instant.') + '</p>' +
      '<p class="note">Vos réponses restent sur cet appareil : elles ne sont ni transmises ni visibles par d’autres personnes.</p>' +
      '<div class="lev-nav"><button class="btn" data-ouvrir-fiche="6" data-aller="#/fiches">Fiche réflexe IKOS</button><button class="btn" data-aller="#/levier/4">Levier 4</button></div>' +
      SIGNATURE;
  }

  /* ---------- Routage ---------- */
  var position = {};
  function majProgression() { var t = total(); $("progGlobale").textContent = t[0] + " / " + t[1] + " actions"; }
  function route() {
    var h = location.hash || "#/arbre";
    var m = h.match(/^#\/levier\/([1-6])$/);
    var ecran, titre, tab, retour = false;
    if (m) {
      var i = +m[1] - 1;
      var ancien = $("e-levier").dataset.levier;
      if (String(i) !== ancien) ongletCourant = "diag";
      rendreLevier(i);
      ecran = "e-levier"; titre = "Levier " + (i + 1) + " · " + LEVIERS[i].court; tab = "arbre"; retour = true;
      $("e-levier").scrollTop = 0;
    } else if (h === "#/feuille") { rendreFeuille(); ecran = "e-feuille"; titre = "Feuille de route · 90 jours"; tab = "feuille"; }
    else if (h === "#/fiches") { rendreFiches(); ecran = "e-fiches"; titre = "Fiches réflexes"; tab = "fiches"; }
    else if (h === "#/ikos") { rendreIkos(); ecran = "e-ikos"; titre = "Prise en main d’IKOS"; tab = "ikos"; }
    else if (h === "#/indicateurs") { rendreKpi(); ecran = "e-kpi"; titre = "Indicateurs de pilotage"; tab = "indicateurs"; }
    else { rendreArbre(); ecran = "e-arbre"; titre = "Plan de transformation"; tab = "arbre"; }
    document.querySelectorAll(".ecran").forEach(function (s) { s.classList.toggle("actif", s.id === ecran); s.setAttribute("aria-hidden", String(s.id !== ecran)); });
    document.querySelectorAll(".tab").forEach(function (t) { if (t.dataset.tab === tab) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
    $("titreBarre").textContent = titre;
    $("topbar").classList.toggle("avec-retour", retour);
    if (ecran !== "e-levier" && position[ecran] != null) $(ecran).scrollTop = position[ecran];
    majProgression();
  }
  document.querySelectorAll(".ecran").forEach(function (s) { s.addEventListener("scroll", function () { position[s.id] = s.scrollTop; }, { passive: true }); });

  function aller(h) { if (location.hash === h) route(); else location.hash = h; }

  /* ---------- Interactions ---------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-aller],[data-onglet],[data-cle],[data-phase],[data-kpi],[data-fiche],[data-q],[data-mat],[data-ikos-reset]");
    if (!t || t.disabled) return;
    if (t.dataset.ouvrirFiche) ficheOuverte = +t.dataset.ouvrirFiche;
    if (t.dataset.aller) { ev.preventDefault(); if (t.dataset.aller === "#/arbre") position["e-arbre"] = 0; aller(t.dataset.aller); }
    else if (t.dataset.onglet) montrerOnglet(t.dataset.onglet);
    else if (t.dataset.cle) {
      var k = t.dataset.cle, v = !faites[k];
      if (v) faites[k] = true; else delete faites[k];
      sauver();
      t.setAttribute("aria-checked", String(v));
      var i = +k.split("-")[0];
      $("avLev").textContent = nbFaites(i) + " / " + LEVIERS[i].actions.length + " actions";
      majProgression();
      toast(v ? "Action marquée comme engagée" : "Action décochée");
    }
    else if (t.dataset.phase) { phaseCourante = +t.dataset.phase; rendreFeuille(); }
    else if (t.dataset.fiche) { var f = +t.dataset.fiche; ficheOuverte = ficheOuverte === f ? -1 : f; var yf = $("e-fiches").scrollTop; rendreFiches(); $("e-fiches").scrollTop = yf; }
    else if (t.dataset.q) { ikos.rep[+t.dataset.q] = +t.dataset.v; sauverIkos(); var yq = $("e-ikos").scrollTop; rendreIkos(); $("e-ikos").scrollTop = yq; if (niveauDe(ikos.rep) && +t.dataset.q === QUESTIONS.length - 1) toast("Niveau calculé"); }
    else if (t.dataset.mat) { var mi = +t.dataset.mat, mv = +t.dataset.v; ikos.mat[mi] = ikos.mat[mi] === mv ? 0 : mv; sauverIkos(); var ym = $("e-ikos").scrollTop; rendreIkos(); $("e-ikos").scrollTop = ym; }
    else if (t.dataset.ikosReset) { ikos.rep = []; sauverIkos(); rendreIkos(); }
    else if (t.dataset.kpi) { var n = +t.dataset.kpi; kpiOuvert = kpiOuvert === n ? -1 : n; var y = $("e-kpi").scrollTop; rendreKpi(); $("e-kpi").scrollTop = y; }
  });
  $("btnRetour").addEventListener("click", function () { position["e-arbre"] = 0; aller("#/arbre"); });

  // Balayage horizontal entre leviers et entre onglets
  var x0 = null, y0 = null;
  $("e-levier").addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  $("e-levier").addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * .7) return;
    var ids = ONGLETS.map(function (o) { return o[0]; }), k = ids.indexOf(ongletCourant);
    if (dx < 0 && k < ids.length - 1) montrerOnglet(ids[k + 1]);
    else if (dx > 0 && k > 0) montrerOnglet(ids[k - 1]);
  }, { passive: true });

  document.addEventListener("change", function (ev) {
    if (ev.target.id === "ikosRole") { ikos.role = ev.target.value; sauverIkos(); var y = $("e-ikos").scrollTop; rendreIkos(); $("e-ikos").scrollTop = y; }
  });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
