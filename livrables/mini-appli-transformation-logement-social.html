<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2316233b'/%3E%3Cpath d='M32 16v14M14 46V30h36v16M32 30v16' stroke='%23faf8f4' stroke-width='3' fill='none'/%3E%3Ccircle cx='32' cy='14' r='5' fill='%23faf8f4'/%3E%3Ccircle cx='14' cy='48' r='5' fill='%23faf8f4'/%3E%3Ccircle cx='32' cy='48' r='5' fill='%23faf8f4'/%3E%3Ccircle cx='50' cy='48' r='5' fill='%23faf8f4'/%3E%3C/svg%3E">
<title>Plan de transformation — Mini appli</title>
<style>
  :root {
    --nuit: #16233b; --bleu: #3e5a78; --canard: #33625e;
    --papier: #faf8f4; --carte: #fffefb; --filet: #d9d4ca; --filet-2: #e6e1d8;
    --texte: #2b2f36; --discret: #6b6a66;
    --serif: Charter, "Bitstream Charter", "Iowan Old Style", Georgia, serif;
    --sans: Inter, -apple-system, "Segoe UI", system-ui, Roboto, Arial, sans-serif;
    --haut: calc(56px + env(safe-area-inset-top));
    --bas: calc(64px + env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: #e9e5de; color: var(--texte); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  :focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 400; color: var(--nuit); margin: 0; line-height: 1.2; }
  p { margin: 0 0 .7em; }
  ul, ol { margin: 0; padding: 0; list-style: none; }

  .app { position: relative; max-width: 480px; height: 100%; margin: 0 auto; background: var(--papier); overflow: hidden; box-shadow: 0 0 0 1px var(--filet); }

  /* Barre du haut */
  .topbar { position: absolute; top: 0; left: 0; right: 0; height: var(--haut); padding-top: env(safe-area-inset-top); background: var(--nuit); color: #fff; display: flex; align-items: center; gap: 8px; padding-left: 8px; padding-right: 16px; z-index: 10; }
  .topbar .titre { font-size: 15px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .topbar .retour { display: none; align-items: center; gap: 2px; height: 40px; padding: 0 8px; color: #fff; font-size: 15px; }
  .topbar.avec-retour .retour { display: inline-flex; }
  .topbar:not(.avec-retour) .titre { padding-left: 8px; }
  .topbar .prog { font-size: 12px; color: #b9c2cc; white-space: nowrap; }

  /* Écrans */
  .ecran { position: absolute; top: var(--haut); bottom: var(--bas); left: 0; right: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 22px 18px 28px; opacity: 0; transform: translateX(16px); pointer-events: none; transition: opacity .22s ease, transform .22s ease; }
  .ecran.actif { opacity: 1; transform: none; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { .ecran { transition: none; } }

  .surtitre { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--discret); font-weight: 600; margin-bottom: 8px; }
  .ecran h1 { font-size: 28px; margin-bottom: 10px; }
  .chapo { color: var(--discret); font-size: 15px; }

  /* Arbre */
  .racine { border-top: 2px solid var(--nuit); border-bottom: 1px solid var(--filet); padding: 14px 0; margin: 18px 0 0; font-family: var(--serif); font-size: 18px; color: var(--nuit); line-height: 1.35; }
  .racine span { display: block; font-family: var(--sans); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--discret); margin-bottom: 4px; }
  .tronc { width: 1px; height: 18px; background: var(--nuit); margin-left: 14px; }
  .branches { margin-left: 14px; border-left: 1px solid var(--nuit); padding-left: 18px; }
  .branche { position: relative; display: grid; grid-template-columns: 30px 1fr 18px; gap: 10px; align-items: center; width: 100%; padding: 14px 0; border-bottom: 1px solid var(--filet); }
  .branche::before { content: ""; position: absolute; left: -18px; top: 50%; width: 12px; height: 1px; background: var(--nuit); }
  .branche .n { font-family: var(--serif); font-size: 30px; line-height: 1; color: var(--bleu); }
  .branche:nth-child(even) .n { color: var(--canard); }
  .branche .t { font-weight: 600; color: var(--nuit); font-size: 15.5px; line-height: 1.3; display: block; }
  .branche .p { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--discret); }
  .jauge { flex: 1; max-width: 120px; height: 3px; background: var(--filet-2); position: relative; }
  .jauge i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--canard); transition: width .3s; }
  .fleche { color: var(--discret); }
  .branche:active { background: #f3efe8; }

  .synthese { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid var(--nuit); margin-top: 26px; }
  .synthese div { padding: 10px 8px 0 0; }
  .synthese div + div { padding-left: 10px; border-left: 1px solid var(--filet); }
  .synthese strong { display: block; font-family: var(--serif); font-weight: 400; font-size: 26px; color: var(--nuit); line-height: 1.1; }
  .synthese span { font-size: 11.5px; color: var(--discret); line-height: 1.3; display: block; }

  .publics { margin-top: 26px; }
  .publics details { border-top: 1px solid var(--filet); }
  .publics details:last-child { border-bottom: 1px solid var(--filet); }
  .publics summary { list-style: none; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .publics summary::-webkit-details-marker { display: none; }
  .publics summary b { font-weight: 600; color: var(--nuit); font-size: 14.5px; }
  .publics summary em { font-style: normal; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--canard); font-weight: 600; display: block; }
  .publics summary::after { content: "+"; font-size: 20px; color: var(--discret); }
  .publics details[open] summary::after { content: "–"; }
  .publics p { font-size: 14px; color: var(--texte); padding-bottom: 6px; }

  /* Levier */
  .lev-tete { display: flex; gap: 14px; align-items: flex-end; border-bottom: 2px solid var(--nuit); padding-bottom: 14px; }
  .lev-tete .gn { font-family: var(--serif); font-size: 64px; line-height: .8; color: var(--bleu); }
  .lev-tete.pair .gn { color: var(--canard); }
  .lev-tete h1 { font-size: 24px; margin: 0; }
  .lev-resume { font-family: var(--serif); font-style: italic; color: var(--discret); font-size: 15.5px; margin: 12px 0 0; }
  .lev-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12px; color: var(--discret); }
  .lev-meta b { color: var(--nuit); font-weight: 600; }

  .onglets { position: sticky; top: -22px; z-index: 2; background: var(--papier); margin: 16px -18px 0; padding: 10px 18px 0; display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--filet); }
  .onglets::-webkit-scrollbar { display: none; }
  .onglet { flex: none; padding: 8px 0 10px; font-size: 13.5px; font-weight: 600; color: var(--discret); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .onglet[aria-selected="true"] { color: var(--nuit); border-bottom-color: var(--nuit); }
  .panneau { padding-top: 16px; min-height: 240px; }
  .panneau[hidden] { display: none; }

  .diag li { position: relative; padding: 0 0 10px 22px; font-size: 15px; }
  .diag li::before { content: "—"; position: absolute; left: 0; color: var(--discret); }

  .act li { border-bottom: 1px solid var(--filet-2); }
  .act li:first-child { border-top: 1px solid var(--filet); }
  .case { display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding: 12px 0; width: 100%; align-items: start; }
  .case .box { width: 22px; height: 22px; border: 1.5px solid var(--nuit); display: grid; place-items: center; margin-top: 1px; background: var(--carte); }
  .case .box svg { opacity: 0; }
  .case[aria-checked="true"] .box { background: var(--canard); border-color: var(--canard); }
  .case[aria-checked="true"] .box svg { opacity: 1; }
  .case strong { display: block; color: var(--nuit); font-size: 15px; line-height: 1.35; }
  .case span.d { display: block; color: var(--discret); font-size: 13.5px; margin-top: 2px; line-height: 1.4; }
  .case[aria-checked="true"] strong { color: var(--canard); }
  .astuce { font-size: 12.5px; color: var(--discret); margin-top: 12px; font-style: italic; font-family: var(--serif); }

  .pil li { border-top: 1px solid var(--filet); padding: 10px 0; }
  .pil em { display: block; font-style: normal; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--discret); font-weight: 600; }
  .pil b { display: block; color: var(--nuit); font-weight: 600; font-size: 15px; }
  .pil span { font-size: 13.5px; color: var(--discret); }

  .jal { border-left: 1px solid var(--nuit); margin-left: 6px; }
  .jal li { position: relative; padding: 0 0 18px 20px; }
  .jal li::before { content: ""; position: absolute; left: -5px; top: 6px; width: 9px; height: 9px; background: var(--canard); }
  .jal b { display: block; font-family: var(--serif); font-weight: 400; font-size: 22px; color: var(--canard); line-height: 1.1; }
  .jal span { font-size: 15px; }

  .eff li { border-top: 1px solid var(--filet); padding: 10px 0; font-size: 15px; }
  .eff em { display: block; font-style: normal; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--canard); font-weight: 600; }

  .lev-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 12px; border: 1px solid var(--filet); background: var(--carte); color: var(--nuit); font-size: 14px; font-weight: 600; text-align: center; }
  .btn.plein { background: var(--nuit); color: #fff; border-color: var(--nuit); grid-column: 1 / -1; }
  .btn:disabled { opacity: .35; cursor: default; }

  /* 90 jours */
  .segments { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--nuit); margin: 16px 0 6px; }
  .segment { padding: 9px 4px; font-size: 13px; font-weight: 600; text-align: center; color: var(--nuit); }
  .segment + .segment { border-left: 1px solid var(--nuit); }
  .segment[aria-selected="true"] { background: var(--nuit); color: #fff; }
  .phase-t { margin-top: 18px; }
  .phase-t h2 { font-size: 22px; }
  .phase-t p { color: var(--discret); font-size: 14.5px; margin-top: 4px; }
  .etapes { margin-top: 10px; border-top: 1px solid var(--filet); }
  .etape { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: baseline; width: 100%; padding: 11px 0; border-bottom: 1px solid var(--filet-2); font-size: 14.5px; }
  .etape b { color: var(--nuit); font-variant-numeric: tabular-nums; font-size: 13px; }
  .etape i { font-style: normal; font-size: 11px; font-weight: 600; color: var(--discret); border: 1px solid var(--filet); padding: 0 5px; }
  .rdv { margin-top: 14px; font-size: 14px; border-left: 2px solid var(--canard); padding-left: 12px; }
  .rdv b { color: var(--nuit); }
  .instances { margin-top: 26px; }
  .instances li { border-top: 1px solid var(--filet); padding: 10px 0; font-size: 13.5px; color: var(--discret); }
  .instances b { display: block; color: var(--nuit); font-size: 14.5px; }

  /* Indicateurs */
  .kpi { border-top: 1px solid var(--filet); }
  .kpi:last-of-type { border-bottom: 1px solid var(--filet); }
  .kpi-tete { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 14px 0; }
  .kpi-tete .n { font-family: var(--serif); font-size: 26px; color: var(--bleu); line-height: 1; }
  .kpi-tete .t { font-weight: 600; color: var(--nuit); font-size: 14.5px; line-height: 1.3; }
  .kpi-tete .c { font-family: var(--serif); color: var(--canard); font-size: 19px; white-space: nowrap; text-align: right; }
  .kpi-corps { padding: 0 0 16px 36px; font-size: 14px; }
  .kpi-corps[hidden] { display: none; }
  .kpi-corps .def { color: var(--discret); }
  .kpi-corps dl { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; margin: 8px 0; }
  .kpi-corps dt { color: var(--discret); }
  .kpi-corps dd { margin: 0; }
  .kpi-corps .alerte { border-left: 2px solid var(--bleu); padding-left: 10px; margin: 10px 0; }
  .liens { display: flex; flex-wrap: wrap; gap: 6px; }
  .liens button { border: 1px solid var(--filet); padding: 4px 9px; font-size: 12.5px; font-weight: 600; color: var(--nuit); }
  .note { font-size: 12.5px; color: var(--discret); font-style: italic; font-family: var(--serif); margin-top: 14px; }

  .signature { margin-top: 34px; padding-top: 14px; border-top: 2px solid var(--nuit); }
  .signature span { display: block; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--discret); }
  .signature b { font-family: var(--serif); font-weight: 400; font-size: 22px; color: var(--nuit); }

  /* Barre d'onglets */
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--bas); padding-bottom: env(safe-area-inset-bottom); background: var(--carte); border-top: 1px solid var(--filet); display: grid; grid-template-columns: repeat(3, 1fr); z-index: 10; }
  .tab { text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--discret); text-align: center; }
  .tab svg { width: 22px; height: 22px; }
  .tab[aria-current="page"] { color: var(--nuit); box-shadow: inset 0 2px 0 var(--nuit); }

  .toast { position: absolute; left: 50%; bottom: calc(var(--bas) + 14px); transform: translate(-50%, 10px); background: var(--nuit); color: #fff; font-size: 13px; padding: 8px 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; white-space: nowrap; }
  .toast.vu { opacity: 1; transform: translate(-50%, 0); }

  @media (min-width: 520px) {
    body { padding: 24px 0; }
    .app { height: calc(100% - 48px); max-height: 900px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <button class="retour" id="btnRetour" aria-label="Retour à l’arbre">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Arbre
    </button>
    <div class="titre" id="titreBarre">Plan de transformation</div>
    <div class="prog" id="progGlobale"></div>
  </header>

  <main>
    <section class="ecran" id="e-arbre" aria-label="Arbre d’action"></section>
    <section class="ecran" id="e-levier" aria-label="Levier"></section>
    <section class="ecran" id="e-feuille" aria-label="Feuille de route à 90 jours"></section>
    <section class="ecran" id="e-kpi" aria-label="Indicateurs de pilotage"></section>
  </main>

  <nav class="tabbar" aria-label="Navigation">
    <a class="tab" href="#/arbre" data-tab="arbre" role="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="4.5" r="2" stroke="currentColor" stroke-width="1.6"/><circle cx="5" cy="19" r="2" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="19" r="2" stroke="currentColor" stroke-width="1.6"/><circle cx="19" cy="19" r="2" stroke="currentColor" stroke-width="1.6"/><path d="M12 6.5V12M5 17v-5h14v5M12 12v5" stroke="currentColor" stroke-width="1.6"/></svg>
      Arbre
    </a>
    <a class="tab" href="#/feuille" data-tab="feuille" role="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17M8 3v4M16 3v4M7 13.5h3M7 16.5h6" stroke="currentColor" stroke-width="1.6"/></svg>
      90 jours
    </a>
    <a class="tab" href="#/indicateurs" data-tab="indicateurs" role="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20h16M6.5 16v-4M11 16V8M15.5 16v-6M20 16V5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Indicateurs
    </a>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  "use strict";
  var LEVIERS = [
    {
      id: "levier-1",
      titre: "Réguler les flux et les sollicitations",
      court: "Réguler les flux",
      resume: "Qualifier, orienter et prioriser les demandes pour que chacun puisse traiter son travail sans interruption permanente.",
      piloteCle: "Direction de la clientèle",
      horizon: "J90",
      diagnostic: [
        "Les sollicitations des locataires arrivent par de multiples canaux (téléphone, courriel, accueil, gardiens, élus, associations) sans qualification commune.",
        "Les chargés de clientèle, gestionnaires et gardiens sont interrompus en continu ; le travail de fond est repoussé.",
        "Une même demande est souvent adressée plusieurs fois, à plusieurs interlocuteurs, faute de réponse lisible.",
        "Il n’existe pas de règle partagée pour distinguer l’urgent de l’important ; les délais de réponse ne sont pas maîtrisés."
      ],
      actions: [
        ["Cartographier les flux entrants", "volumes, canaux, motifs et temps de traitement, mesurés sur quatre semaines dans chaque agence."],
        ["Instaurer un premier niveau de réponse unique", "accueil téléphonique et numérique avec une grille de qualification et de routage commune à toutes les agences."],
        ["Définir une matrice d’urgence partagée", "sécurité des personnes, technique, social, administratif : un délai cible par catégorie, connu des équipes et des locataires."],
        ["Protéger des plages de travail sans sollicitation", "demi-journées réservées au traitement des dossiers pour les équipes de gestion."],
        ["Organiser un circuit dédié aux élus et partenaires", "un interlocuteur identifié par territoire et un suivi des réponses apportées."]
      ],
      pilotes: [
        ["Pilote", "Direction de la clientèle", "Conçoit le dispositif et en rend compte."],
        ["Contributeurs", "Responsables d’agence", "Déploient le routage et les plages protégées."],
        ["Appui", "Direction des systèmes d’information", "Paramètre la gestion de la relation client."]
      ],
      jalons: [["J30", "Cartographie des flux restituée"], ["J60", "Matrice d’urgence et règles de routage validées"], ["J90", "Premier niveau unique opérationnel sur l’agence pilote"]],
      effets: [
        ["Locataires", "Une réponse plus rapide et un interlocuteur clairement identifié."],
        ["Équipes", "Moins d’interruptions, davantage de temps pour traiter les dossiers en profondeur."],
        ["Managers de proximité", "Des règles de priorité claires pour arbitrer au quotidien."],
        ["Direction", "Une vision objective de la demande pour dimensionner les moyens."]
      ]
    },
    {
      id: "levier-2",
      titre: "Décloisonner les équipes",
      court: "Décloisonner",
      resume: "Faire travailler ensemble gestion locative, technique, social et proximité autour des situations des locataires.",
      piloteCle: "Direction des opérations",
      horizon: "J90",
      diagnostic: [
        "Les métiers (gestion locative, maintenance et patrimoine, recouvrement, accompagnement social, proximité) fonctionnent en filières séparées.",
        "Les passages de relais entre services n’ont pas de responsable : certains dossiers restent sans suite.",
        "Les situations complexes (troubles de voisinage, impayés associés à des désordres techniques, fragilités sociales) sont traitées en morceaux.",
        "Le siège et les agences se perçoivent mutuellement comme des contraintes plutôt que comme des appuis."
      ],
      actions: [
        ["Rédiger une charte des interfaces", "qui fait quoi, qui décide, dans quel délai le relais est pris entre deux services."],
        ["Tenir une revue hebdomadaire des dossiers complexes", "par territoire, réunissant gestion locative, technique, social et proximité."],
        ["Désigner un référent unique par dossier transverse", "il suit le dossier de bout en bout et tient le locataire informé."],
        ["Constituer des binômes gestion locative et technique par secteur", "mêmes patrimoines, mêmes interlocuteurs, objectifs partagés."],
        ["Organiser des immersions croisées", "une demi-journée par mois dans un autre service, siège et agences compris."]

      }).join("") + '</div>' +
      '<div class="rdv"><b>Rendez-vous :</b> ' + esc(p.livrable) + '</div>' +
      '<ul class="instances"><li><b>Comité de direction · mensuel</b>Arbitrages, ressources, revue des 5 indicateurs.</li><li><b>Comité de pilotage · tous les 15 jours</b>Pilotes des 6 leviers : avancement, risques.</li><li><b>Points d’équipe · hebdomadaires</b>Déploiement terrain et remontée des irritants.</li></ul>' +
      SIGNATURE;
  }

  /* ---------- Écran Indicateurs ---------- */
  var kpiOuvert = -1;
  function rendreKpi() {
    $("e-kpi").innerHTML =
      '<div class="surtitre">Pilotage</div><h1>Cinq indicateurs</h1><p class="chapo">Suivis en comité de direction. Touchez un indicateur pour sa fiche.</p>' +
      KPIS.map(function (k, i) {
        return '<div class="kpi"><button class="kpi-tete" aria-expanded="' + (i === kpiOuvert) + '" data-kpi="' + i + '"><span class="n">' + (i + 1) + '</span><span class="t">' + esc(k.titre) + '</span><span class="c">' + esc(k.cible) + '</span></button>' +
          '<div class="kpi-corps"' + (i === kpiOuvert ? "" : " hidden") + '><p class="def">' + esc(k.def) + '</p><dl>' +
          '<dt>Cible</dt><dd>' + esc(k.cible) + ' ' + esc(k.cibleTxt) + '</dd><dt>Calcul</dt><dd>' + esc(k.formule) + '</dd><dt>Fréquence</dt><dd>' + esc(k.frequence) + '</dd><dt>Source</dt><dd>' + esc(k.source) + '</dd><dt>Responsable</dt><dd>' + esc(k.responsable) + '</dd></dl>' +
          '<div class="alerte"><b>Seuil d’alerte :</b> ' + esc(k.alerte) + '</div>' +
          '<div class="liens">' + k.leviers.map(function (n) { return '<button data-aller="#/levier/' + n + '">Levier ' + n + ' · ' + esc(LEVIERS[n - 1].court) + '</button>'; }).join("") + '</div></div></div>';
      }).join("") +
      '<p class="note">Valeurs de référence mesurées dans les 30 premiers jours ; cibles confirmées en comité de direction à J30.</p>' + SIGNATURE;
  }

  /* ---------- Routage ---------- */
  var position = {};
  function majProgression() { var t = total(); $("progGlobale").textContent = t[0] + " / " + t[1] + " actions"; }
  function route() {
    var h = location.hash || "#/arbre";
    var m = h.match(/^#\/levier\/([1-6])$/);
    var ecran, titre, tab, retour = false;
    if (m) {
      var i = +m[1] - 1;
      var ancien = $("e-levier").dataset.levier;
      if (String(i) !== ancien) ongletCourant = "diag";
      rendreLevier(i);
      ecran = "e-levier"; titre = "Levier " + (i + 1) + " · " + LEVIERS[i].court; tab = "arbre"; retour = true;
      $("e-levier").scrollTop = 0;
    } else if (h === "#/feuille") { rendreFeuille(); ecran = "e-feuille"; titre = "Feuille de route · 90 jours"; tab = "feuille"; }
    else if (h === "#/indicateurs") { rendreKpi(); ecran = "e-kpi"; titre = "Indicateurs de pilotage"; tab = "indicateurs"; }
    else { rendreArbre(); ecran = "e-arbre"; titre = "Plan de transformation"; tab = "arbre"; }
    document.querySelectorAll(".ecran").forEach(function (s) { s.classList.toggle("actif", s.id === ecran); s.setAttribute("aria-hidden", String(s.id !== ecran)); });
    document.querySelectorAll(".tab").forEach(function (t) { if (t.dataset.tab === tab) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
    $("titreBarre").textContent = titre;
    $("topbar").classList.toggle("avec-retour", retour);
    if (ecran !== "e-levier" && position[ecran] != null) $(ecran).scrollTop = position[ecran];
    majProgression();
  }
  document.querySelectorAll(".ecran").forEach(function (s) { s.addEventListener("scroll", function () { position[s.id] = s.scrollTop; }, { passive: true }); });

  function aller(h) { if (location.hash === h) route(); else location.hash = h; }

  /* ---------- Interactions ---------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-aller],[data-onglet],[data-cle],[data-phase],[data-kpi]");
    if (!t || t.disabled) return;
    if (t.dataset.aller) { ev.preventDefault(); if (t.dataset.aller === "#/arbre") position["e-arbre"] = 0; aller(t.dataset.aller); }
    else if (t.dataset.onglet) montrerOnglet(t.dataset.onglet);
    else if (t.dataset.cle) {
      var k = t.dataset.cle, v = !faites[k];
      if (v) faites[k] = true; else delete faites[k];
      sauver();
      t.setAttribute("aria-checked", String(v));
      var i = +k.split("-")[0];
      $("avLev").textContent = nbFaites(i) + " / " + LEVIERS[i].actions.length;
      majProgression();
      toast(v ? "Action marquée comme engagée" : "Action décochée");
    }
    else if (t.dataset.phase) { phaseCourante = +t.dataset.phase; rendreFeuille(); }
    else if (t.dataset.kpi) { var n = +t.dataset.kpi; kpiOuvert = kpiOuvert === n ? -1 : n; var y = $("e-kpi").scrollTop; rendreKpi(); $("e-kpi").scrollTop = y; }
  });
  $("btnRetour").addEventListener("click", function () { position["e-arbre"] = 0; aller("#/arbre"); });

  // Balayage horizontal entre leviers et entre onglets
  var x0 = null, y0 = null;
  $("e-levier").addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  $("e-levier").addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * .7) return;
    var ids = ONGLETS.map(function (o) { return o[0]; }), k = ids.indexOf(ongletCourant);
    if (dx < 0 && k < ids.length - 1) montrerOnglet(ids[k + 1]);
    else if (dx > 0 && k > 0) montrerOnglet(ids[k - 1]);
  }, { passive: true });

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
